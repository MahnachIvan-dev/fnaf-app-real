<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FNAF — Camera</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="cam-page" id="camPage">
        <div class="title title-sm" style="margin-bottom:10px;">SECURITY CAMERA</div>
        <div style="font-size:1.4rem; color:var(--yellow);" id="camIdx"></div>

        <video id="vid" autoplay playsinline muted style="display:none; margin:10px 0;"></video>
        <canvas id="capCvs" style="display:none;"></canvas>

        <div class="status-text" id="statusTxt">Initializing...</div>

        <button class="btn" id="btnEnableCam" style="display:none">📷 ENABLE CAMERA</button>

        <!-- Экран поломки (Кликабелен ВЕСЬ экран + отдельно кнопка) -->
        <div class="broken-full" id="brokenFull" style="cursor:pointer;">
            <div class="noise-bg"></div>
            <div style="z-index:101; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; width:100%; height:100%; pointer-events:auto;">
                <div style="color:var(--red); font-family:'Press Start 2P',cursive; font-size:clamp(.9rem, 4vw, 1.4rem); line-height:1.8; margin-bottom:20px;">
                    CAMERA<br>MALFUNCTION
                </div>
                
                <div style="color:var(--yellow); font-size:1.2rem; margin-bottom:15px; animation:blink 1s infinite;">
                    [ TAP ANYWHERE TO REPAIR ]
                </div>

                <button class="btn yellow" id="btnRepair" style="font-size:1.4rem; padding:15px 30px; cursor:pointer; touch-action:manipulation; z-index:102;">
                    🔧 REPAIR (20s)
                </button>

                <div class="progress-bar" id="repairBar" style="margin-top:20px; display:none; width:80%; max-width:300px; height:20px; border:2px solid var(--yellow);">
                    <div class="fill" id="repairFill" style="height:100%; background:var(--yellow); width:0%;"></div>
                </div>
                <div id="repairStatus" style="color:var(--green); font-size:1.2rem; margin-top:12px;"></div>
            </div>
        </div>
    </div>

    <!-- Финальные экраны -->
    <div class="end-overlay" id="winEnd">
        <div class="win-big" style="font-size:clamp(1.5rem,8vw,3rem);">6 AM</div>
        <div class="win-sub">NIGHT COMPLETE</div>
    </div>
    <div class="end-overlay" id="loseEnd">
        <div class="scare-text" style="font-size:clamp(1rem,5vw,2rem);">GAME OVER</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/camera.js"></script>
</body>
</html>
