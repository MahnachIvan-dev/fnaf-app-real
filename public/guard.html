<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FNAF — Security Monitor</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- ЗАГЛУШКА ДЛЯ РАЗБЛОКИРОВКИ ЗВУКА НА ТЕЛЕФОНАХ -->
    <div id="audioUnlock" style="position:fixed; inset:0; z-index:99999; background:#000; color:var(--green); display:flex; align-items:center; justify-content:center; font-size:1.5rem; cursor:pointer; font-family:'Press Start 2P', cursive; text-align:center; padding:20px;">
        TAP ANYWHERE<br>TO ENTER SECURITY ROOM
    </div>

    <div class="guard-root" id="root">
        
        <button id="muteCallBtn" class="mute-call-btn" style="display:none;" onclick="mutePhoneCall()">[ MUTE CALL ]</button>
        <button id="fsBtn" class="fullscreen-btn" onclick="toggleFullScreen()">[ ⛶ FULLSCREEN ]</button>

        <div class="door-status-hud" id="doorStatusHud"></div>

        <div class="office" id="office" style="display:none">
            <div class="office-desk"></div>
            <div class="office-monitor-btn" id="officeMonBtn">
                <span>TAP / SPACE<br>to view cameras</span>
            </div>
        </div>

        <div class="cam-container" id="camCont">
            <div class="cam-view" id="camView">
                <canvas id="camCanvas"></canvas>
                <div class="no-signal" id="noSig" style="display:none">NO SIGNAL</div>
            </div>
            <div class="cam-overlay">
                <div class="cam-rec"><div class="dot"></div> REC</div>
                <div class="cam-label-text" id="camLbl">CAM 1</div>
            </div>
            <div class="static-layer"></div>
            <div class="cam-btns" id="camBtns"></div>
        </div>

        <div class="hud">
            <div class="hud-top">
                <div class="hud-time" id="hTime">12 AM</div>
                <div class="hud-power">
                    <div class="pwr-label">POWER</div>
                    <div class="pwr-val hi" id="hPwr">100%</div>
                    <div class="pwr-usage" id="hUsage"></div>
                </div>
            </div>
        </div>

        <div id="doorBtns" style="display:none;"></div>
        <div class="touch-bar" id="touchBar"></div>

        <div class="pwr-out-screen" id="pwrOut">
            <!-- ВИДЕО ФРЕДДИ (ПОКАЗЫВАЕТСЯ ТОЛЬКО ПРИ 0%) -->
            <video id="freddyVid" class="freddy-vid" loop playsinline style="display:none;">
                <source src="https://files.catbox.moe/uvgcnk.mp4" type="video/mp4">
            </video>

            <div class="pwr-out-text" style="z-index: 2;">POWER OUT</div>
            
            <!-- ОГРОМНАЯ КНОПКА ПЕРЕЗАГРУЗКИ ДЛЯ ТЕЛЕФОНОВ И ПК -->
            <button class="btn yellow" id="bigRebootBtn" style="display:none; z-index: 2; margin-top:30px; font-size:1.5rem; padding:20px; text-align:center;">
                🔄 REBOOT SYSTEM [H]
            </button>

            <div class="progress-bar" id="rebootBar" style="display:none; z-index: 2; margin-top:30px;"><div class="fill" id="rebootFill"></div></div>
            <div id="rebootMsg" style="z-index: 2; color:var(--yellow); font-size:1.2rem; margin-top:10px;"></div>
        </div>

        <div class="scare-screen" id="scareScr"><div class="scare-text">GAME OVER</div></div>
        
        <div class="win-screen" id="winScr">
            <div class="fnaf-clock-box">
                <div class="digit-container">
                    <div class="digits-slide" id="digitSlide">
                        <div>5</div>
                        <div>6</div>
                    </div>
                </div>
                <span class="am-text">AM</span>
            </div>
            <div class="win-sub">YOU SURVIVED THE NIGHT!</div>
            <div id="confBox"></div>
        </div>

        <div class="flash" id="flash"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/guard.js"></script>
</body>
</html>
